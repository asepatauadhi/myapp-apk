name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: myapp-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk "myapp-1.0.0.apk"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "myapp-1.0.0.apk" --target "$GITHUB_SHA" --title "My App" --notes "Build otomatis Html/web2Apk"
